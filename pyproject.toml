[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headless-driver"
version = "1.2.0"
description = "Web search, page reading and browser automation for Python and AI agents. Search Brave, DuckDuckGo, Yahoo, Mojeek, Google and Bing with no API key, read pages as clean Markdown, and give both to agents as OpenAI, Anthropic, LangChain, LlamaIndex or CrewAI tools, or over MCP. Browser TLS impersonation, consensus ranking, honest block detection, caching, Selenium and Playwright."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "nuhmanpk", email = "nuhmanpk7@gmail.com" }
]
maintainers = [
  { name = "nuhmanpk", email = "nuhmanpk7@gmail.com" }
]
dependencies = [
  "selenium>=4.35,<5",
  "webdriver-manager>=4.0.0",
  "selenium-stealth>=1.0.6",
  "geckodriver-autoinstaller>=0.1.0"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Testing",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
  "Typing :: Typed"
]

keywords = [
  "search-scraper", "search-engine-scraper", "serp-scraper", "serp", "serp-api",
  "web-search", "web-search-api", "search-api", "metasearch", "search-results",
  "google-search", "google-scraper", "bing-search", "duckduckgo", "duckduckgo-search",
  "brave-search", "yahoo-search", "mojeek", "startpage", "yandex", "ddgs",
  "web-scraping", "scraper", "scraping", "crawler", "linkedin-scraper",
  "tls-fingerprint", "impersonate", "curl-cffi", "anti-bot", "anti-detection",
  "stealth", "captcha-detection", "rate-limit", "circuit-breaker", "proxy",
  "selenium", "playwright", "headless", "headless-browser", "headless-chrome",
  "chromium", "webdriver", "chromedriver", "browser-automation", "automation",
  "screenshot", "pdf-export", "llm", "llm-tools", "ai-agents", "rag",
  "retrieval-augmented-generation", "agent-tools", "mcp", "mcp-server",
  "model-context-protocol", "langchain", "llamaindex", "crewai", "openai-tools",
  "anthropic-tools", "function-calling", "html-to-markdown", "web-to-markdown",
  "llm-web-search", "ai-search", "cache", "cli",
]

[project.optional-dependencies]
# Browser-impersonating HTTP (curl_cffi): a real Chrome/Safari/Firefox TLS and
# HTTP/2 fingerprint. The one to use from cloud/datacentre addresses, and what
# transport="auto" prefers.
#   pip install "headless-driver[impersonate]"
impersonate = [
  "curl_cffi>=0.7",
  "beautifulsoup4>=4.12",
]
# Plain-requests browserless mode: portable, but fingerprinted as Python.
#   pip install "headless-driver[http]"
http = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]
# Playwright as the browser backend, plus extract/capture_json. Then run:
#   playwright install chromium
playwright = [
  "playwright>=1.40",
  "beautifulsoup4>=4.12",
]
# Faster HTML parsing at volume; used automatically when installed.
fast = [
  "lxml>=4.9",
]
# `headless-driver mcp`: web search and page reading for Claude, Cursor and
# other MCP clients. The MCP SDK needs Python 3.10+.
mcp = [
  "mcp>=1.2; python_version >= '3.10'",
  "curl_cffi>=0.7",
  "beautifulsoup4>=4.12",
]
# Toolkit.langchain_tools() and typed pydantic schemas for agent frameworks.
# LlamaIndex and CrewAI work too; install them yourself (they are large).
agents = [
  "langchain-core>=0.2",
  "pydantic>=2",
  "curl_cffi>=0.7",
  "beautifulsoup4>=4.12",
]
# Exact token counts in fetch_markdown() (an estimate is used without it).
tokens = [
  "tiktoken>=0.5",
]
# cache="redis://…": a result cache shared by a fleet.
redis = [
  "redis>=5",
]
# The documentation site (mkdocs serve).
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]
# Everything a program can use at runtime.
all = [
  "curl_cffi>=0.7",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "playwright>=1.40",
  "lxml>=4.9",
  "mcp>=1.2; python_version >= '3.10'",
  "pydantic>=2",
  "tiktoken>=0.5",
  "redis>=5",
]
# Tooling for tests, coverage and releases, not needed at runtime:
#   pip install -e ".[dev]"
dev = [
  "build>=1.0",
  "twine>=5.0",
  "trove-classifiers",
  "coverage[toml]>=7.4",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "curl_cffi>=0.7",
  "playwright>=1.40",
  "mcp>=1.2; python_version >= '3.10'",
  "langchain-core>=0.2",
  "pydantic>=2",
  "tiktoken>=0.5",
  "fakeredis>=2.20",
]

[project.scripts]
headless-driver = "headless.cli:main"

[project.urls]
Homepage = "https://github.com/nuhmanpk/headless-driver"
Documentation = "https://github.com/nuhmanpk/headless-driver/blob/main/DOCS.md"
Changelog = "https://github.com/nuhmanpk/headless-driver/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/nuhmanpk/headless-driver/blob/main/TODO.md"
"LLM docs" = "https://github.com/nuhmanpk/headless-driver/blob/main/llms.txt"
"Docs site" = "https://nuhmanpk.github.io/headless-driver/"
Source = "https://github.com/nuhmanpk/headless-driver"
Issues = "https://github.com/nuhmanpk/headless-driver/issues"
Funding = "https://github.com/sponsors/nuhmanpk"

[tool.setuptools.package-data]
headless = ["py.typed"]

[tool.setuptools.packages.find]
include = ["headless*"]
exclude = ["images*"]

[tool.coverage.run]
branch = true
source = ["headless"]
# Playwright's sync API runs on greenlets; without this their lines look unrun.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
